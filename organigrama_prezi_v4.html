<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Porcerámica · Organigrama</title>
<style>
  :root{ --thread:#ffb648; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%, #000000 0%, #0b1a2b 70%);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:#fff;-webkit-tap-highlight-color:transparent;
  }
  .stage{position:fixed;inset:0;overflow:hidden;}
  #world{
    position:absolute;top:0;left:0;width:3400px;height:3400px;
    transform-origin:0 0;
    transition:transform 1.25s cubic-bezier(.62,.02,.14,1);
    will-change:transform;
  }
  svg{overflow:visible;display:block;}
  #chart{width:3400px;height:3400px;}

  .node{cursor:pointer;transition:opacity .7s ease;}
  .node .ring{fill:none;stroke:#fff;stroke-opacity:.92;}
  .node .halo{fill:none;stroke:var(--thread);stroke-width:0;opacity:0;
    transition:stroke-width .5s, opacity .5s;}
  .node.focus .halo{stroke-width:10;opacity:.95;}
  .lbl{fill:#fff;text-anchor:middle;font-weight:800;letter-spacing:.01em;
    pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.42);
    stroke-width:3px;stroke-linejoin:round;}
  .sub{fill:rgba(255,255,255,.95);text-anchor:middle;font-weight:700;
    pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2.5px;}
  .node:hover .wedge,.node:hover .fillc,.node:hover .halfp{filter:brightness(1.12);}
  .link{fill:none;stroke-width:6;stroke-opacity:.5;transition:opacity .7s;}

  #threadGlow{fill:none;stroke:var(--thread);stroke-width:32;
    stroke-linecap:round;opacity:.15;filter:blur(12px);}
  #threadPath{fill:none;stroke:var(--thread);stroke-width:13;
    stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 20px rgba(255,182,72,.85));}
  .thread-dot{fill:var(--thread);filter:drop-shadow(0 0 12px rgba(255,182,72,.9));}

  .brand{position:fixed;top:22px;left:26px;z-index:30;
    font-size:16px;font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.62);}
  .brand b{color:var(--thread);}

  .hud-right{position:fixed;top:18px;right:24px;z-index:30;display:flex;gap:10px;}
  .btn{background:rgba(255,255,255,.08);color:#fff;
    border:1.5px solid rgba(255,255,255,.18);padding:12px 22px;
    border-radius:100px;font-size:16px;font-weight:800;cursor:pointer;
    backdrop-filter:blur(10px);transition:opacity .4s, background .25s;}
  .btn:hover{background:rgba(255,255,255,.18);}
  .btn.off{opacity:0;pointer-events:none;}
  .btn.accent{background:var(--thread);color:#0b1a2b;border-color:transparent;}
  .btn.accent:hover{background:#ffc76d;}

  #crumbs{position:fixed;bottom:0;left:0;right:0;z-index:30;
    display:flex;align-items:center;justify-content:center;
    padding:20px 20px 24px;overflow-x:auto;
    background:linear-gradient(to top, rgba(6,16,28,.96) 30%, rgba(6,16,28,0));}
  .crumb{display:flex;align-items:center;gap:10px;padding:10px 20px;
    border-radius:100px;cursor:pointer;font-size:17px;font-weight:800;
    letter-spacing:.02em;color:rgba(255,255,255,.62);white-space:nowrap;
    transition:all .35s;}
  .crumb .dot{width:12px;height:12px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .crumb:hover{color:#fff;}
  .crumb.on{color:#0b1a2b;background:var(--thread);box-shadow:0 0 24px rgba(255,182,72,.5);}
  .link-line{width:26px;height:2px;flex-shrink:0;background:rgba(255,182,72,.35);}

  /* ---------- HOJA DE IMPRESIÓN ----------
     Se mantiene renderizada fuera de pantalla (no display:none) para que
     el navegador pueda medir el texto; solo aparece al imprimir. */
  #printSheet{position:absolute;left:-100000px;top:0;width:400mm;
    background:#0b1a2b;color:#fff;padding:4mm 5mm;}
  .phead{border-bottom:1.2pt solid rgba(255,182,72,.65);padding-bottom:2mm;margin-bottom:3mm;}
  .phead h1{font-size:23pt;font-weight:800;letter-spacing:.05em;}
  .phead h1 span{color:var(--thread);font-weight:700;}
  .phead .psub{font-size:11pt;opacity:.72;margin-top:1mm;letter-spacing:.04em;}
  .pgrid{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:5mm;align-items:start;}
  .pmid{display:flex;flex-direction:column;gap:3mm;}
  .ringwrap{width:122mm;align-self:center;}
  .areas{display:grid;grid-template-columns:1fr 1fr;gap:3mm;}
  .cluster{margin-bottom:6mm;}
  .chead{display:flex;align-items:baseline;gap:2.4mm;font-size:15.5pt;font-weight:800;
    letter-spacing:.05em;padding-bottom:1.4mm;margin-bottom:2mm;
    border-bottom:1pt solid rgba(255,255,255,.28);}
  .chead .cdot{width:3.4mm;height:3.4mm;border-radius:50%;background:#4a86c4;flex:0 0 auto;}
  .chead em{font-style:normal;font-size:10pt;font-weight:600;opacity:.6;letter-spacing:.02em;}
  .depts{display:grid;grid-template-columns:1fr 1fr;gap:3mm;}
  .dept{border-left:2mm solid var(--c);background:rgba(255,255,255,.055);
    border-radius:1.6mm;padding:2.6mm 3.2mm;break-inside:avoid;}
  .dept h4{font-size:12pt;font-weight:800;letter-spacing:.03em;color:var(--c);
    margin-bottom:1mm;filter:brightness(1.25);}
  .dept ul{list-style:none;}
  .dept li{font-size:11pt;font-weight:600;line-height:1.46;opacity:.95;}
  .dept li::before{content:'· ';opacity:.55;}

  @media print{
    @page{ size:A3 landscape; margin:8mm; }
    html,body{overflow:visible;height:auto;background:#0b1a2b !important;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .stage,.brand,#crumbs,.hud-right{display:none !important;}
    #printSheet{position:static;left:0;width:auto;padding:0;}
    .pgrid{gap:4mm;}
    section.cluster,.dept{break-inside:avoid;page-break-inside:avoid;}
  }
</style>

const ROOT={id:'center',label:'CASA MATRIZ',color:'#0f2947',r:CORE_R,kind:'core',
  children:[...HALVES,...SUCS]};

/* ============ LAYOUT INTERACTIVO ============ */
const N={};
function layout(node,parent,depth){
  node.parent=parent?parent.id:null;
  node.depth=depth;
  N[node.id]=node;
  if(depth===0){node.x=CX;node.y=CY;node.outward=0;}
  const kids=node.children||[];
  if(!kids.length)return;

  if(depth===0){
    kids.forEach(k=>{
      if(k.kind==='half'){
        const mid=(k.a0+k.a1)/2;
        // centroide del semicírculo
        const d=4*CORE_R/(3*Math.PI);
        const p=pol(d,mid);
        k.x=p.x;k.y=p.y;k.r=CORE_R*0.62;k.outward=mid;
      }else{
        const p=pol(k.dist,k.angle);
        k.x=p.x;k.y=p.y;k.outward=k.angle;
      }
      layout(k,node,1);
    });
  }else if(node.kind==='half'){
    kids.forEach(k=>{                       // gajos de la corona
      const mid=(k.a0+k.a1)/2;
      const p=pol(RMID,mid);
      k.x=p.x;k.y=p.y;k.r=(RO-RI)/2;k.outward=mid;
      layout(k,node,depth+1);
    });
  }else{
    const outward=node.outward!==undefined?node.outward
      :Math.atan2(node.y-CY,node.x-CX)*180/Math.PI;
    const kr=kids[0].r||70;
    const base=node.kind==='wedge'?(RO-RMID):node.r;
    const dist=base+kr+(node.kind==='wedge'?190:(depth===1?185:110));
    const minStep=2*Math.asin(Math.min(1,(kr*2.6)/(2*dist)))*180/Math.PI;
    const step=Math.max(minStep, node.kind==='wedge'?34:(depth===1?36:30));
    const start=outward-(kids.length-1)*step/2;
    kids.forEach((k,i)=>{
      const a=kids.length===1?outward:start+step*i;
      const p=P(node.x,node.y,dist,a);
      k.x=p.x;k.y=p.y;k.outward=a;
      layout(k,node,depth+1);
    });
  }
}
layout(ROOT,null,0);

/* ============ HELPERS DE DIBUJO ============ */
function curveD(x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;
  const mx=x1+dx*.5-dy*.05,my=y1+dy*.5+dx*.05;
  return `M${x1},${y1} Q${mx},${my} ${x2},${y2}`;
}
function annulus(cx,cy,ri,ro,a1,a2){
  const p1=P(cx,cy,ro,a1),p2=P(cx,cy,ro,a2);
  const p3=P(cx,cy,ri,a2),p4=P(cx,cy,ri,a1);
  const lg=(a2-a1)>180?1:0;
  return `M${p1.x},${p1.y} A${ro},${ro} 0 ${lg} 1 ${p2.x},${p2.y}
          L${p3.x},${p3.y} A${ri},${ri} 0 ${lg} 0 ${p4.x},${p4.y} Z`;
}
function halfPath(cx,cy,r,a1,a2){
  const p1=P(cx,cy,r,a1),p2=P(cx,cy,r,a2);
  const lg=(a2-a1)>180?1:0;
  return `M${cx},${cy} L${p1.x},${p1.y} A${r},${r} 0 ${lg} 1 ${p2.x},${p2.y} Z`;
}
// espacio libre dentro de un gajo desde su punto medio, en una dirección
function sectorExtent(cx,cy,ri,ro,a0,a1,ux,uy){
  const mid=(a0+a1)/2, p0=P(cx,cy,(ri+ro)/2,mid);
  const inside=t=>{
    const x=p0.x+ux*t,y=p0.y+uy*t,dx=x-cx,dy=y-cy;
    const rr=Math.hypot(dx,dy);
    if(rr<ri||rr>ro)return false;
    let d=(Math.atan2(dy,dx)*180/Math.PI)-mid;d=((d+540)%360)-180;
    return Math.abs(d)<=(a1-a0)/2;
  };
  if(!inside(1))return 1;
  let lo=0,hi=ro;
  for(let i=0;i<40;i++){const m=(lo+hi)/2;inside(m)?lo=m:hi=m;}
  return lo;
}

function drawText(g,node,cx,cy,maxW,maxH,forceFs,store){
  const lines=node.label.split('\n'),hasSub=!!node.sub,BASE=100;
  const t=E('text',{class:'lbl','font-size':BASE,x:cx,y:cy});
  lines.forEach((l,i)=>{const ts=E('tspan',{x:cx,dy:i===0?0:BASE});ts.textContent=l;t.appendChild(ts);});
  g.appendChild(t);
  let widest=1;
  for(const ts of t.childNodes){const w=ts.getComputedTextLength?ts.getComputedTextLength():0;if(w>widest)widest=w;}
  let sEl=null,subW=1;
  if(hasSub){
    sEl=E('text',{class:'sub','font-size':BASE,x:cx,y:cy});
    sEl.textContent=node.sub;g.appendChild(sEl);
    subW=sEl.getComputedTextLength?sEl.getComputedTextLength():1;
  }
  const byW=maxW/(widest/BASE);
  const bySubW=hasSub?maxW/((subW*0.78)/BASE):Infinity;
  const byH=maxH/(lines.length*1.2+(hasSub?1.15:0));
  const fs=forceFs||Math.max(14,Math.min(byW,bySubW,byH,80));
  const lh=fs*1.22, block=(lines.length-1)*lh+(hasSub?fs*1.5:0);
  const y0=cy-block/2+fs*0.34;
  t.setAttribute('font-size',fs.toFixed(1));t.setAttribute('y',y0.toFixed(1));
  Array.from(t.childNodes).forEach((ts,i)=>ts.setAttribute('dy',i===0?0:lh.toFixed(1)));
  if(sEl){
    sEl.setAttribute('font-size',(fs*0.78).toFixed(1));
    sEl.setAttribute('y',(y0+(lines.length-1)*lh+fs*1.45).toFixed(1));
  }
  if(store!==false){node._tp={g,cx,cy,maxW,maxH};node._fs=fs;}
  return fs;
}
function unifySiblings(){
  const groups={};
  Object.values(N).forEach(n=>{if(!n._tp)return;
    const key=(n.parent||'root')+'|'+(n.kind||'c');
    (groups[key]=groups[key]||[]).push(n);});
  Object.values(groups).forEach(list=>{
    if(list.length<2)return;
    const min=Math.min(...list.map(n=>n._fs));
    list.forEach(n=>{
      if(Math.abs(n._fs-min)<0.5)return;
      const {g,cx,cy,maxW,maxH}=n._tp;
      g.querySelectorAll('text').forEach(t=>t.remove());
      drawText(g,n,cx,cy,maxW,maxH,min);
    });
  });
}

/* ============ RENDER INTERACTIVO ============ */
const gLinks=E('g',{});svg.appendChild(gLinks);
const gThread=E('g',{});svg.appendChild(gThread);
const threadGlow=E('path',{id:'threadGlow',d:''});
const threadPath=E('path',{id:'threadPath',d:''});
gThread.appendChild(threadGlow);gThread.appendChild(threadPath);
const gDots=E('g',{});svg.appendChild(gDots);
const gRing=E('g',{});svg.appendChild(gRing);
const gNodes=E('g',{});svg.appendChild(gNodes);

// aro exterior
gRing.appendChild(E('circle',{cx:CX,cy:CY,r:BORDER_R,fill:'none',stroke:'#173a5e','stroke-width':34}));
gRing.appendChild(E('circle',{cx:CX,cy:CY,r:BORDER_R+18,fill:'none',stroke:'#0f2947','stroke-width':5,'stroke-opacity':.8}));

// gajos de la corona
HALVES.forEach(h=>h.children.forEach(w=>{
  const n=N[w.id];
  const g=E('g',{class:'node',id:'n_'+w.id});
  gRing.appendChild(g);
  g.appendChild(E('path',{class:'halo',d:annulus(CX,CY,RI,RO,w.a0,w.a1),fill:'none'}));
  g.appendChild(E('path',{class:'wedge',d:annulus(CX,CY,RI,RO,w.a0,w.a1),fill:w.color,
    stroke:'#0f2947','stroke-width':7}));
  const hx=Math.min(sectorExtent(CX,CY,RI,RO,w.a0,w.a1,1,0),sectorExtent(CX,CY,RI,RO,w.a0,w.a1,-1,0));
  const hy=Math.min(sectorExtent(CX,CY,RI,RO,w.a0,w.a1,0,1),sectorExtent(CX,CY,RI,RO,w.a0,w.a1,0,-1));
  drawText(g,n,n.x,n.y,hx*1.80,hy*1.62);
  g.addEventListener('click',e=>{e.stopPropagation();navigate(w.id);});
  n.el=g;
}));

// las dos mitades del núcleo
HALVES.forEach(h=>{
  const n=N[h.id];
  const g=E('g',{class:'node',id:'n_'+h.id});
  gRing.appendChild(g);
  g.appendChild(E('path',{class:'halo',d:halfPath(CX,CY,CORE_R+14,h.a0,h.a1),fill:'none'}));
  g.appendChild(E('path',{class:'halfp',d:halfPath(CX,CY,CORE_R,h.a0,h.a1),fill:h.color,
    stroke:'#fff','stroke-width':5,'stroke-opacity':.9}));
  drawText(g,n,n.x,n.y,CORE_R*0.74,CORE_R*1.05);
  g.addEventListener('click',e=>{e.stopPropagation();navigate(h.id);});
  n.el=g;
});
gRing.appendChild(E('circle',{cx:CX,cy:CY,r:RI,fill:'none',stroke:'#0f2947','stroke-width':12}));

// círculos (sucursales, departamentos, cargos, subáreas)
function renderCircles(node){
  (node.children||[]).forEach(k=>{
    if(k.kind==='half'||k.kind==='wedge'){renderCircles(k);return;}
    // El enlace nace del centro del gajo (no de un punto del aro que puede
    // caer sobre otro gajo y parecer una línea suelta).
    const from = node.kind==='core'? pol(BORDER_R,k.outward)
               : node.kind==='wedge'? pol(RMID,(node.a0+node.a1)/2)
               : {x:node.x,y:node.y};
    const p=E('path',{class:'link',d:curveD(from.x,from.y,k.x,k.y),stroke:k.color});
    gLinks.appendChild(p);k.linkEl=p;
    const g=E('g',{class:'node',id:'n_'+k.id});
    gNodes.appendChild(g);
    g.appendChild(E('circle',{class:'halo',cx:k.x,cy:k.y,r:k.r+18}));
    g.appendChild(E('circle',{class:'fillc',cx:k.x,cy:k.y,r:k.r,fill:k.color}));
    g.appendChild(E('circle',{class:'ring',cx:k.x,cy:k.y,r:k.r,'stroke-width':Math.max(2,k.r*0.045)}));
    drawText(g,k,k.x,k.y,k.r*1.66,k.r*1.46);
    g.addEventListener('click',e=>{e.stopPropagation();navigate(k.id);});
    k.el=g;
    renderCircles(k);
  });
}
renderCircles(ROOT);
unifySiblings();

/* ============ NAVEGACIÓN ============ */
let path=['center'];
const backBtn=document.getElementById('back');
const crumbs=document.getElementById('crumbs');
const ALL_WEDGES=[].concat(...HALVES.map(h=>h.children.map(w=>w.id)));

function ancestors(id){const o=[];let c=N[id];while(c){o.unshift(c.id);c=c.parent?N[c.parent]:null;}return o;}
function anchorOf(id){
  const n=N[id];
  if(!n)return{x:CX,y:CY};
  if(id==='center')return{x:CX,y:CY};
  return{x:n.x,y:n.y};
}

function applyVisibility(){
  const cur=path[path.length-1], node=N[cur];
  const vis=new Set(path);
  (node.children||[]).forEach(k=>vis.add(k.id));
  HALVES.forEach(h=>vis.add(h.id));           // el núcleo siempre visible

  if(cur==='center'){
    SUCS.forEach(s=>vis.add(s.id));           // vista general: núcleo + sucursales
  }else if(node.kind==='suc'){
    SUCS.forEach(s=>vis.add(s.id));
  }else if(node.kind==='wedge'){
    (N[node.parent].children||[]).forEach(w=>vis.add(w.id));
  }

  Object.values(N).forEach(n=>{
    if(!n.el)return;
    const show=vis.has(n.id);
    const active=path.includes(n.id)||(node.children||[]).some(k=>k.id===n.id);
    n.el.style.opacity=show?(active?1:0.32):0;
    n.el.style.pointerEvents=show?'auto':'none';
    n.el.classList.toggle('focus',n.id===cur);
    if(n.linkEl){n.linkEl.style.opacity=(show&&vis.has(n.parent))?1:0;}
  });
}

function drawThread(){
  if(path.length<2){threadPath.setAttribute('d','');threadGlow.setAttribute('d','');gDots.innerHTML='';return;}
  let d='';
  for(let i=0;i<path.length-1;i++){
    const a=anchorOf(path[i]),b=anchorOf(path[i+1]);
    const seg=curveD(a.x,a.y,b.x,b.y);
    d+=(i===0?seg:seg.replace(/^M[^Q]+/,' '));
  }
  threadPath.setAttribute('d',d);threadGlow.setAttribute('d',d);
  const len=threadPath.getTotalLength();
  threadPath.style.transition='none';
  threadPath.style.strokeDasharray=len;threadPath.style.strokeDashoffset=len;
  void threadPath.getBoundingClientRect();
  threadPath.style.transition='stroke-dashoffset 1.1s cubic-bezier(.5,0,.2,1)';
  threadPath.style.strokeDashoffset=0;
  gDots.innerHTML='';
  path.forEach((id,i)=>{
    const a=anchorOf(id);
    const c=E('circle',{class:'thread-dot',cx:a.x,cy:a.y,r:14});
    c.style.opacity=0;c.style.transition=`opacity .4s ${i*0.12}s`;
    gDots.appendChild(c);requestAnimationFrame(()=>{c.style.opacity=1;});
  });
}

function frameOf(node){
  const box=[];
  const add=(x,y,r)=>box.push({x,y,r});
  // muestrea la forma real de un gajo o media luna para encuadrar ajustado
  const shape=n=>{
    if(n.kind==='wedge'){
      for(let a=n.a0;a<=n.a1;a+=3){
        const p1=pol(RI,a),p2=pol(RO,a);add(p1.x,p1.y,4);add(p2.x,p2.y,4);
      }
    }else if(n.kind==='half'){
      for(let a=n.a0;a<=n.a1;a+=5){const p=pol(CORE_R,a);add(p.x,p.y,4);}
      add(CX,CY,4);
    }else add(CX,CY,BORDER_R+22);
  };
  const put=id=>{
    const n=N[id];if(!n)return;
    if(n.id==='center')add(CX,CY,BORDER_R+22);
    else if(n.kind==='wedge'||n.kind==='half')shape(n);
    else add(n.x,n.y,n.r+16);
  };
  put(node.id);
  if(node.parent)put(node.parent);
  (node.children||[]).forEach(k=>{
    if(k.kind==='wedge'||k.kind==='half')shape(k);
    else add(k.x,k.y,k.r+16);
  });
  let x1=1/0,y1=1/0,x2=-1/0,y2=-1/0;
  box.forEach(b=>{x1=Math.min(x1,b.x-b.r);y1=Math.min(y1,b.y-b.r);
                  x2=Math.max(x2,b.x+b.r);y2=Math.max(y2,b.y+b.r);});
  return{cx:(x1+x2)/2,cy:(y1+y2)/2,w:x2-x1,h:y2-y1};
}
function zoom(node){
  const f=frameOf(node), padTop=80,padBottom=110,padSide=70;
  const vw=window.innerWidth-padSide*2, vh=window.innerHeight-padTop-padBottom;
  const scale=Math.min(vw/f.w,vh/f.h,4);
  world.style.transform=
    `translate(${padSide+vw/2-f.cx*scale}px,${padTop+vh/2-f.cy*scale}px) scale(${scale})`;
}
function renderCrumbs(){
  crumbs.innerHTML='';
  path.forEach((id,i)=>{
    if(i>0){const l=document.createElement('div');l.className='link-line';crumbs.appendChild(l);}
    const b=document.createElement('div');
    b.className='crumb'+(i===path.length-1?' on':'');
    const dot=document.createElement('span');dot.className='dot';
    dot.style.background=i===path.length-1?'#0b1a2b':(N[id].color||'#fff');
    b.appendChild(dot);
    const t=document.createElement('span');
    t.textContent=N[id].label.replace(/\n/g,' ');
    b.appendChild(t);
    b.onclick=()=>{path=path.slice(0,i+1);update();};
    crumbs.appendChild(b);
  });
}
function update(){
  applyVisibility();drawThread();
  zoom(N[path[path.length-1]]);renderCrumbs();
  backBtn.classList.toggle('off',path.length<=1);
}
function navigate(id){
  if(id===path[path.length-1])return;
  const i=path.indexOf(id);
  path=i>=0?path.slice(0,i+1):ancestors(id);
  update();
}
backBtn.onclick=()=>{if(path.length>1){path.pop();update();}};
document.addEventListener('keydown',e=>{
  if((e.key==='Escape'||e.key==='Backspace')&&path.length>1){path.pop();update();}
});
window.addEventListener('resize',()=>zoom(N[path[path.length-1]]));
update();

/* ============================================================
   HOJA DE IMPRESIÓN: una sola página A3 horizontal, todo visible.
   Se usa maquetación HTML con tamaños en puntos para garantizar
   legibilidad; el anillo central se dibuja como SVG pequeño.
   ============================================================ */
function buildPrint(){
  const sheet=document.getElementById('printSheet');
  const RC=170, rci=182, rco=330;   // geometría del anillo impreso

  function ringSVG(){
    const W=720, c=W/2;
    let out=`<svg viewBox="0 0 ${W} ${W}" width="100%">`;
    out+=`<circle cx="${c}" cy="${c}" r="${rco+22}" fill="none" stroke="#173a5e" stroke-width="26"/>`;
    HALVES.forEach(h=>h.children.forEach(w=>{
      const a1=w.a0*Math.PI/180,a2=w.a1*Math.PI/180;
      const P1=[c+rco*Math.cos(a1),c+rco*Math.sin(a1)],P2=[c+rco*Math.cos(a2),c+rco*Math.sin(a2)];
      const P3=[c+rci*Math.cos(a2),c+rci*Math.sin(a2)],P4=[c+rci*Math.cos(a1),c+rci*Math.sin(a1)];
      const lg=(w.a1-w.a0)>180?1:0;
      const mid=(w.a0+w.a1)/2*Math.PI/180, tr=(rci+rco)/2;
      const tx=c+tr*Math.cos(mid), ty=c+tr*Math.sin(mid);
      const lines=w.label.split('\n');
      out+=`<path d="M${P1} A${rco},${rco} 0 ${lg} 1 ${P2} L${P3} A${rci},${rci} 0 ${lg} 0 ${P4} Z" fill="${w.color}" stroke="#0f2947" stroke-width="5"/>`;
      out+=`<text x="${tx}" y="${ty-(lines.length-1)*11}" text-anchor="middle" fill="#fff" font-size="21" font-weight="800" font-family="Segoe UI,sans-serif">`;
      lines.forEach((l,i)=>{out+=`<tspan x="${tx}" dy="${i?23:6}">${l}</tspan>`;});
      out+=`</text>`;
    }));
    HALVES.forEach(h=>{
      const a1=h.a0*Math.PI/180,a2=h.a1*Math.PI/180;
      const P1=[c+RC*Math.cos(a1),c+RC*Math.sin(a1)],P2=[c+RC*Math.cos(a2),c+RC*Math.sin(a2)];
      const lg=(h.a1-h.a0)>180?1:0;
      const mid=(h.a0+h.a1)/2*Math.PI/180, d=4*RC/(3*Math.PI);
      const tx=c+d*Math.cos(mid), ty=c+d*Math.sin(mid);
      const lines=h.label.split('\n');
      out+=`<path d="M${c},${c} L${P1} A${RC},${RC} 0 ${lg} 1 ${P2} Z" fill="${h.color}" stroke="#fff" stroke-width="4" stroke-opacity=".9"/>`;
      out+=`<text x="${tx}" y="${ty-(lines.length-1)*11}" text-anchor="middle" fill="#fff" font-size="20" font-weight="800" font-family="Segoe UI,sans-serif">`;
      lines.forEach((l,i)=>{out+=`<tspan x="${tx}" dy="${i?22:6}">${l}</tspan>`;});
      out+=`</text>`;
    });
    out+=`</svg>`;
    return out;
  }

  function deptBox(d){
    const roles=(d.children||[]).map(c=>`<li>${c.label.replace(/\n/g,' ')}</li>`).join('');
    return `<div class="dept" style="--c:${d.color}">
      <h4>${d.label.replace(/\n/g,' ')}</h4><ul>${roles}</ul></div>`;
  }
  function cluster(s){
    return `<section class="cluster">
      <div class="chead"><span class="cdot"></span>${s.label}
        <em>Administrador de sucursal</em></div>
      <div class="depts">${s.children.map(deptBox).join('')}</div>
    </section>`;
  }
  const areaBoxes=[].concat(...HALVES.map(h=>h.children)).map(deptBox).join('');

  sheet.innerHTML=`
    <div class="phead">
      <h1>PORCERAMICA <span>— ESTRUCTURA ORGANIZACIONAL</span></h1>
      <div class="psub">Casa Matriz · Lindora · Coyol · Curridabat · Huacas</div>
    </div>
    <div class="pgrid">
      <div class="pcol">${cluster(SUCS[3])}${cluster(SUCS[2])}</div>
      <div class="pmid">
        <div class="ringwrap">${ringSVG()}</div>
        <div class="areas">${areaBoxes}</div>
      </div>
      <div class="pcol">${cluster(SUCS[0])}${cluster(SUCS[1])}</div>
    </div>`;
}
buildPrint();
document.getElementById('printBtn').onclick=()=>window.print();
</script>
